name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build KiotViet Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Install Dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: 5. Sync Web Assets into Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 6. Build Android APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../KiotViet-App.apk

      - name: 7. Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KiotViet-Android-APK
          path: ./KiotViet-App.apk
          if-no-files-found: error

      - name: 8. Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "KiotViet Android App (.APK Mới Nhất)"
          body: |
            ### Ứng dụng Android KiotViet Quản Lý Bán Hàng & Kho (.APK)
            - **Cách cài đặt trên điện thoại Android**: Bấm trực tiếp vào file **`KiotViet-App.apk`** bên dưới mục **Assets** để tải về máy và nhấn **Cài đặt**.
            - Ứng dụng hoạt động độc lập 100% (kể cả khi không có Internet).
          files: ./KiotViet-App.apk
          prerelease: false
